name: Release

# Builds Keleuo.app (universal: Apple silicon and Intel), signs it with the Developer ID cert,
# notarizes it and staples the ticket. A pushed tag (v0.1.0, ...) also publishes the zip as a GitHub release.
# Run by hand from the Actions tab to test the pipeline without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      APPLE_SIGN_IDENTITY: "Developer ID Application: WUNDUR AI LEARNING, LLC (${{ vars.APPLE_TEAM_ID }})"
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          # Cargo.toml is the version (the About window shows it); a tag must match it.
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$CARGO_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $CARGO_VERSION in Cargo.toml"
              exit 1
            fi
            echo "VERSION=$CARGO_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=$CARGO_VERSION-dev" >> "$GITHUB_ENV"
          fi
          # The build number: goes up with every run, as macOS and updaters expect.
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build the app bundle
        run: ./scripts/bundle-macos.sh "$VERSION" "$RUNNER_TEMP/bundle" "$BUILD"

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed -e 's/"//g')

      - name: Sign the bundle
        run: |
          APP="$RUNNER_TEMP/bundle/Keleuo.app"
          # Inside out: the helper, then the window, then the bundle. No --deep.
          for item in "$APP/Contents/MacOS/keleuo-hook" "$APP/Contents/MacOS/keleuo-mcp" "$APP/Contents/MacOS/keleuo" "$APP"; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "$item"
          done
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="$RUNNER_TEMP/bundle/Keleuo.app"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Keleuo-notarize.zip"
          # Fails the job if Apple rejects it. The log is then at: xcrun notarytool log <id> (same key flags).
          xcrun notarytool submit "$RUNNER_TEMP/Keleuo-notarize.zip" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          # Stapling fetches the ticket from Apple, which now and then drops the connection: retry.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP" && xcrun stapler validate "$APP"; then break; fi
            [ "$attempt" = 5 ] && exit 1
            echo "Stapling failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          rm -f "$KEY"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/bundle/Keleuo.app" "dist/Keleuo-${VERSION}-universal.zip"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/bundle/Keleuo.app"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Keleuo-${{ env.VERSION }}-universal
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Keleuo $VERSION" --generate-notes

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
