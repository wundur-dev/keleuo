[workspace]
resolver = "3"
members = ["crates/workbench-core", "crates/workbench-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.dependencies]
workbench-core = { path = "crates/workbench-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ignore = "0.4"
similar = "2"
dirs = "6"

[profile.dev]
# Dependencies optimised so gpui and the terminal stay smooth in debug builds.
[profile.dev.package."*"]
opt-level = 2
