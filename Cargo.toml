[workspace]
resolver = "3"
members = ["crates/keleuo-core", "crates/keleuo-app"]
# The vendored component library is patched in, not a member; excluded so its own tests run
# (`cargo test --manifest-path vendor/gpui-base/Cargo.toml`).
exclude = ["vendor/gpui-base"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99"

[workspace.dependencies]
keleuo-core = { path = "crates/keleuo-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ignore = "0.4"
similar = "2"
dirs = "6"

[profile.dev]
# Dependencies optimised so gpui and the terminal stay smooth in debug builds.
[profile.dev.package."*"]
opt-level = 2

# gpui-base with text decorations for multi-line text (the message box's Markdown
# highlighting). Proposed upstream; drop this once a release has it.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
