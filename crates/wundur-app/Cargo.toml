[package]
name = "wundur-app"
description = "The Wundur desktop window: skills, code, Claude and a terminal side by side."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "wundur"
path = "src/main.rs"

# The command the agent's terminal interface runs on its hook events (see src/hooks.rs).
[[bin]]
name = "wundur-hook"
path = "src/bin/wundur-hook.rs"

[[bin]]
name = "wundur-mcp"
path = "src/bin/wundur-mcp.rs"

[dependencies]
wundur-core = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
# Times in local time ("Today, 16:11") in the session browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { workspace = true }
# gpui-kit pins the matching gpui snapshot (published as gpui-pre 0.3.8) and re-exports gpui,
# gpui-component and the Lucide icon assets.
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-languages"] }
# Highlight queries for grammars gpui-component registers without one (src/languages.rs);
# the same versions it builds.
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-swift = "=0.7.4"
tree-sitter-cmake = "=0.7.5"
alacritty_terminal = "0.26.0"
async-channel = "2"
libc = "0.2"
lsp-types = { version = "0.97", features = ["proposed"] }
# The system web view (WKWebView on macOS) for the Web panel.
wry = { version = "0.57", default-features = false, features = ["devtools"] }
# Local sockets on every OS (Unix domain sockets; named pipes on Windows): the hook
# listener, the hook helper and the single-instance hand-off (see src/local_socket.rs).
interprocess = "2.4"

[dev-dependencies]
# The same gpui-kit with its headless UI test harness (drags, clicks, element queries).
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-languages", "test-support"] }
# Compiling the highlight queries in src/languages.rs's test.
tree-sitter = "=0.26.13"

# The Dock icon (no app bundle yet): NSApplication's icon image, from the embedded PNG; its
# badge and bounce (see src/attention.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry", "NSRange"] }
# Speaking a message (src/voice.rs): Apple's speech recognition on the microphone's audio.
objc2-speech = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"
raw-window-handle = "0.6"

# Spelling in the message box: the system's Spell Checking API (see src/spelling.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }
