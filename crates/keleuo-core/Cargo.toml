[package]
name = "keleuo-core"
description = "Keleuo core: project scanning, skills, the Claude Code stream and its state. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ignore = { workspace = true }
similar = { workspace = true }
dirs = { workspace = true }
notify = "8"
# Images in a message to an agent run headless (embedded in its JSON input).
base64 = "0.22"
# Cursor keeps its chats in SQLite (read-only copies; backends::cursor::store).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Cursor names its chat folders by the md5 of the project path.
md5 = { package = "md-5", version = "0.10" }
# Turn summaries ask a language model server (OpenAI-compatible: LM Studio, Ollama, llama.cpp).
ureq = { version = "3", features = ["json"] }
# Removing a skill puts it in the system Trash (Finder, Recycle Bin), so it can be got back.
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Spelling in the message box off macOS and Windows: Hunspell dictionaries installed on the
# system, read by a pure Rust checker (see spelling::hunspell). The tests use it everywhere.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
spellbook = "0.4"

[dev-dependencies]
spellbook = "0.4"
