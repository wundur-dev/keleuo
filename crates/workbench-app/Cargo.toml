[package]
name = "workbench-app"
description = "The Workbench desktop window: skills, code, Claude and a terminal side by side."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
workbench-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# gpui-kit pins the matching gpui snapshot (published as gpui-pre 0.3.8) and re-exports gpui,
# gpui-component and the Lucide icon assets.
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-languages"] }
alacritty_terminal = "0.26.0"
async-channel = "2"
libc = "0.2"
